# A one-time test: can GitHub's computers download from medRxiv?
name: Try a medRxiv download
on: workflow_dispatch
jobs:
  try:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://api.biorxiv.org/details/medrxiv/2026-11-10/2026-11-11/0" \
                   "https://www.medrxiv.org/content/10.64898/2026.04.04.26349881v2.full.pdf" \
                   "https://www.medrxiv.org/content/early/2026/11/10/2026.04.04.26349881.source.xml"; do
            echo "== $u"
            curl -s -L -m 60 -A "medrxiv_metacheck (github.com/Lakens/medrxiv_metacheck)" -o out \
                 -w "%{http_code} %{content_type} %{size_download}\n" "$u" || true
            head -c 120 out | tr -d '\0'; echo
          done
