# Watches the update runs (scripts/watch.py) and opens one issue for each kind
# of problem: a run that stopped, no new report for a day, a module error,
# preprints that failed for one reason, keys removed from results. A later
# case of the same kind is a comment on its open issue; closing an issue means
# the problem is addressed. GitHub emails the repository's owner about each.
# Separate from "Update the reports", so it goes on when that one stops.
name: Watch the runs

on:
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check the runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/watch.py
